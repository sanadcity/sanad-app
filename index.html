<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SANAD — استرجاع البيانات</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Cairo,sans-serif;background:#0D1117;color:#E6EDF3;min-height:100vh;padding:20px;}
h1{color:#C9A84C;font-size:22px;margin-bottom:4px;}
.sub{color:#8896A4;font-size:13px;margin-bottom:24px;}
.card{background:#161B22;border:1px solid #30363D;border-radius:12px;padding:20px;margin-bottom:16px;}
.card h2{font-size:14px;font-weight:800;color:#E6EDF3;margin-bottom:12px;}
.btn{padding:9px 18px;border-radius:8px;border:none;cursor:pointer;font-family:Cairo,sans-serif;font-size:13px;font-weight:700;}
.btn-p{background:#C9A84C;color:#0D1117;}
.btn-g{background:#21262D;color:#E6EDF3;border:1px solid #30363D;}
.btn-red{background:#DA3633;color:#fff;}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.status{font-size:12px;margin-top:10px;padding:8px 12px;border-radius:8px;background:#21262D;min-height:32px;}
.ok{color:#3FB950;} .err{color:#F85149;} .warn{color:#D29922;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:right;padding:8px 10px;background:#21262D;color:#8896A4;font-weight:700;}
td{padding:8px 10px;border-bottom:1px solid #21262D;color:#E6EDF3;word-break:break-all;}
tr:hover td{background:#21262D55;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-g{background:#1a3a1a;color:#3FB950;} .badge-e{background:#3a1a1a;color:#F85149;}
.prog{font-size:11px;color:#8896A4;margin-top:8px;}
details summary{cursor:pointer;color:#C9A84C;font-size:12px;margin-top:8px;}
pre{background:#0D1117;padding:12px;border-radius:8px;font-size:10px;overflow:auto;max-height:200px;color:#8896A4;}
</style>
</head>
<body>
<h1>🔄 SANAD — استرجاع البيانات</h1>
<p class="sub">هذه الصفحة تجلب كل بياناتك مباشرة من Firebase وتتيح لك استعادتها</p>

<div class="card">
  <h2>📡 الاتصال بـ Firebase</h2>
  <div class="row">
    <button class="btn btn-p" onclick="connectAndFetch()">🔍 جلب كل البيانات من Firebase</button>
    <button class="btn btn-g" onclick="downloadBackup()" id="dl-btn" disabled>💾 تحميل نسخة احتياطية كاملة</button>
  </div>
  <div class="status" id="conn-status">اضغط "جلب كل البيانات" للبدء...</div>
</div>

<div id="results"></div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyA5WV_p5OKLorLu6WTqJ4T3n1njDuRv5Is",
  authDomain:"sanad-city.firebaseapp.com",
  projectId:"sanad-city",
  storageBucket:"sanad-city.firebasestorage.app",
  messagingSenderId:"632767112371",
  appId:"1:632767112371:web:187166ea157815edd93cc6"
});
const DB=firebase.firestore();
const ST=firebase.storage();

let allData={};

const LABELS={
  snd_p4:"المشاريع",
  snd_u4:"المستخدمين",
  snd_s4:"الخدمات",
  snd_q4:"تسلسل المعرّفات",
  snd_tk4:"المهام",
  snd_pr4:"الملف الشخصي",
  snd_ntf4:"الإشعارات",
  snd_wa4:"جهات واتساب",
  snd_lang4:"اللغة",
  snd_logo4:"الشعار",
};

const st=s=>{document.getElementById("conn-status").innerHTML=s;};

async function connectAndFetch(){
  st('<span class="warn">⏳ جارٍ الاتصال بـ Firebase...</span>');
  try{
    const snap=await DB.collection("sanad").get();
    st(`<span class="ok">✅ متصل — وُجد ${snap.size} وثيقة في Firebase</span>`);
    allData={};
    const rows=[];
    snap.forEach(d=>{
      const raw=d.data().v||"null";
      let parsed=null;
      try{parsed=JSON.parse(raw);}catch{}
      allData[d.id]=raw;
      const label=LABELS[d.id]||d.id;
      const count=Array.isArray(parsed)?parsed.length:(parsed&&typeof parsed==="object"?Object.keys(parsed).length:parsed?1:0);
      const isEmpty=!parsed||(Array.isArray(parsed)&&parsed.length===0)||(typeof parsed==="object"&&!Array.isArray(parsed)&&Object.keys(parsed).length===0);
      rows.push({id:d.id,label,count,isEmpty,parsed,raw});
    });

    let html='<div class="card"><h2>📊 البيانات الموجودة في Firebase</h2>';
    html+=`<table><tr><th>المفتاح</th><th>البيانات</th><th>العدد</th><th>الحالة</th></tr>`;
    rows.forEach(r=>{
      html+=`<tr>
        <td><strong>${r.label}</strong><br/><span style="color:#8896A4;font-size:10px;">${r.id}</span></td>
        <td>${buildPreview(r.id,r.parsed)}</td>
        <td style="text-align:center;font-weight:800;color:${r.isEmpty?"#F85149":"#3FB950"};">${r.count}</td>
        <td><span class="badge ${r.isEmpty?"badge-e":"badge-g"}">${r.isEmpty?"فارغ":"✓ موجود"}</span></td>
      </tr>`;
    });
    html+='</table></div>';

    // Projects detail
    const pRow=rows.find(r=>r.id==="snd_p4");
    if(pRow&&Array.isArray(pRow.parsed)&&pRow.parsed.length>0){
      html+=buildProjectsTable(pRow.parsed);
    }

    // Users detail
    const uRow=rows.find(r=>r.id==="snd_u4");
    if(uRow&&Array.isArray(uRow.parsed)&&uRow.parsed.length>0){
      html+=buildUsersTable(uRow.parsed);
    }

    html+=`<div class="card" style="border-color:#C9A84C55;">
      <h2>🔄 استعادة البيانات</h2>
      <p style="font-size:12px;color:#8896A4;margin-bottom:12px;">اضغط الزر التالي لكتابة كل البيانات من Firebase إلى هذا المتصفح ثم فتح التطبيق.</p>
      <div class="row">
        <button class="btn btn-p" onclick="restoreAll()">✅ استعادة كل البيانات وفتح التطبيق</button>
        <button class="btn btn-g" onclick="downloadBackup()">💾 تحميل نسخة احتياطية JSON</button>
      </div>
      <div class="status" id="restore-status"></div>
    </div>`;

    document.getElementById("results").innerHTML=html;
    document.getElementById("dl-btn").disabled=false;
  }catch(e){
    st(`<span class="err">❌ فشل الاتصال: ${e.message}</span>`);
  }
}

function buildPreview(id,parsed){
  if(id==="snd_logo4")return'<span style="color:#8896A4;">صورة (Base64)</span>';
  if(!parsed)return'<span style="color:#F85149;">null</span>';
  if(Array.isArray(parsed)&&parsed.length===0)return'<span style="color:#F85149;">[] فارغ</span>';
  if(Array.isArray(parsed)){
    const sample=parsed[0];
    const keys=Object.keys(sample||{}).slice(0,4).join(", ");
    return`<span style="color:#8896A4;font-size:11px;">array — حقول: ${keys}...</span>`;
  }
  if(typeof parsed==="string")return`<span style="color:#8896A4;">"${parsed}"</span>`;
  return`<span style="color:#8896A4;">${JSON.stringify(parsed).slice(0,60)}</span>`;
}

function buildProjectsTable(projs){
  let html=`<div class="card"><h2>🏗 المشاريع (${projs.length})</h2><table>
    <tr><th>#</th><th>المعرّف</th><th>المالك</th><th>المدينة</th><th>النشاط</th><th>الحالة</th><th>المراحل</th></tr>`;
  projs.forEach((p,i)=>{
    const stagesCount=(p.stages||[]).length;
    const docsCount=(p.stages||[]).reduce((acc,s)=>{
      const up=(s.docs||[]).filter(d=>d.up).length;
      const cdUp=(s.cd||[]).filter(d=>d.up).length;
      return acc+up+cdUp;
    },0);
    html+=`<tr>
      <td>${i+1}</td>
      <td style="font-size:10px;color:#8896A4;">${p.id||"—"}</td>
      <td><strong>${p.ownerName||"—"}</strong></td>
      <td>${p.city||"—"} ${p.district?"· "+p.district:""}</td>
      <td>${p.activity||"—"}</td>
      <td>${p.devStatus||"—"}</td>
      <td style="font-size:11px;">${stagesCount} مرحلة · ${docsCount} ملف مرفوع</td>
    </tr>`;
  });
  html+='</table></div>';
  return html;
}

function buildUsersTable(users){
  let html=`<div class="card"><h2>👤 المستخدمين (${users.length})</h2><table>
    <tr><th>الاسم</th><th>الإيميل</th><th>الدور</th><th>الحالة</th></tr>`;
  users.forEach(u=>{
    html+=`<tr>
      <td>${u.name||"—"}</td>
      <td style="font-size:11px;">${u.email||"—"}</td>
      <td>${u.role||"—"}</td>
      <td><span class="badge ${u.status==="active"?"badge-g":"badge-e"}">${u.status||"—"}</span></td>
    </tr>`;
  });
  html+='</table></div>';
  return html;
}

function restoreAll(){
  const el=document.getElementById("restore-status");
  if(!Object.keys(allData).length){el.innerHTML='<span class="err">❌ اجلب البيانات أولاً</span>';return;}
  let count=0;
  Object.entries(allData).forEach(([k,v])=>{
    try{localStorage.setItem(k,v);count++;}catch(e){}
  });
  el.innerHTML=`<span class="ok">✅ تم استعادة ${count} مفتاح — جارٍ فتح التطبيق...</span>`;
  setTimeout(()=>{window.location.href="index.html";},1500);
}

function downloadBackup(){
  if(!Object.keys(allData).length){alert("اجلب البيانات أولاً");return;}
  const blob=new Blob([JSON.stringify(allData,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`sanad-firebase-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
